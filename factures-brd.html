<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRD Services</title>
<style>
:root{--navy:#0d1b4b;--navy2:#1a2e7a;--gold:#c9a84c;--bg:#f0f2f7;--border:#d1d5db;--muted:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#111;}

.app-header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(13,27,75,.35);}
.header-logo{width:40px;height:40px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;color:var(--navy);}
.header-brand{display:flex;align-items:center;gap:12px;}
.header-title{color:#fff;font-size:1.1rem;font-weight:700;}
.header-sub{color:rgba(255,255,255,.55);font-size:.72rem;}
.header-badge{background:rgba(201,168,76,.2);border:1px solid var(--gold);color:#f0d48a;font-size:.68rem;font-weight:600;padding:4px 12px;border-radius:20px;}

#form-section .container{max-width:640px;margin:36px auto;padding:0 16px 60px;}
.card{background:#fff;border-radius:14px;padding:32px;box-shadow:0 8px 32px rgba(13,27,75,.08);}
.card-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:8px;}
.divider{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:20px 0 12px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.fg input,.fg textarea{width:100%;padding:10px 13px;border:2px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;color:#111;background:#fafbfd;outline:none;transition:border-color .15s;}
.fg input:focus,.fg textarea:focus{border-color:var(--navy2);background:#fff;}
.fg textarea{resize:vertical;min-height:72px;line-height:1.5;}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:4px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 14px rgba(13,27,75,.28);-webkit-tap-highlight-color:transparent;}

#invoice-section{display:none;min-height:100vh;background:var(--bg);}
.inv-toolbar{background:var(--navy);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;position:sticky;top:0;z-index:10;}
.btn-pdf{padding:9px 18px;background:#15803d;color:#fff;border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-mail{padding:9px 18px;background:var(--gold);color:var(--navy);border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-back{padding:9px 18px;background:#b91c1c;color:#fff;border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.inv-wrap{max-width:800px;margin:20px auto;padding:0 12px 40px;}

/* ===== INVOICE DOC ===== */
#invoice-doc{background:#fff;padding:36px 44px 28px;font-family:'Georgia',serif;color:#111;font-size:.86rem;line-height:1.5;position:relative;overflow:hidden;}
#invoice-doc::before{content:"PRO FORMA";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-35deg);font-size:6rem;font-weight:900;color:rgba(201,168,76,.06);letter-spacing:.2em;white-space:nowrap;pointer-events:none;font-family:'Segoe UI',sans-serif;}
#invoice-doc>*{position:relative;z-index:1;}

.inv-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid var(--navy);}
.inv-brand{font-size:1.9rem;font-weight:700;color:var(--navy);font-family:'Segoe UI',sans-serif;line-height:1;}
.inv-brand-tag{font-size:.65rem;color:var(--gold);font-family:'Segoe UI',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-top:4px;}
.inv-brand-info{font-size:.67rem;color:#666;font-family:'Segoe UI',sans-serif;margin-top:8px;line-height:1.65;}
.inv-title-block{text-align:right;}
.inv-pf{display:inline-block;background:var(--gold);color:var(--navy);font-size:.58rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:3px 9px;border-radius:3px;font-family:'Segoe UI',sans-serif;margin-bottom:6px;}
.inv-title{font-size:1.6rem;font-weight:700;color:var(--navy);font-family:'Segoe UI',sans-serif;letter-spacing:.04em;}
.inv-meta{margin-top:6px;font-size:.74rem;color:#555;font-family:'Segoe UI',sans-serif;line-height:1.75;}
.inv-meta strong{color:#111;}

.inv-client{background:#fefaf2;border-left:3px solid var(--gold);padding:8px 14px;margin-bottom:18px;border-radius:0 5px 5px 0;font-family:'Segoe UI',sans-serif;}
.inv-client-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;color:#aaa;font-weight:700;margin-bottom:3px;}
.inv-client-name{font-size:.92rem;font-weight:700;color:#111;}
.inv-client-addr{font-size:.74rem;color:#666;}

table.inv-t{width:100%;border-collapse:collapse;margin-bottom:14px;}
table.inv-t thead th{background:var(--navy);color:#fff;padding:8px 11px;text-align:left;font-size:.63rem;text-transform:uppercase;letter-spacing:.09em;font-family:'Segoe UI',sans-serif;font-weight:600;}
table.inv-t thead th:not(:first-child){text-align:right;}
table.inv-t tbody td{padding:11px 11px;font-size:.82rem;border-bottom:1px solid #eee;vertical-align:top;}
table.inv-t tbody td:not(:first-child){text-align:right;font-family:'Segoe UI',sans-serif;}
table.inv-t tbody td:last-child{font-weight:700;}
.svc-name{font-weight:700;color:#111;font-family:'Segoe UI',sans-serif;margin-bottom:3px;}
.svc-desc{font-size:.75rem;color:#666;font-family:'Segoe UI',sans-serif;line-height:1.5;}

.inv-totals{display:flex;justify-content:flex-end;margin-bottom:14px;}
.inv-totals-inner{width:240px;font-family:'Segoe UI',sans-serif;}
.t-row{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;color:#555;border-bottom:1px solid #eee;}
.t-row.ttc{font-size:.95rem;font-weight:800;color:var(--navy);border-top:2px solid var(--navy);border-bottom:none;padding-top:8px;margin-top:3px;}

.inv-pay{background:#f5f7fb;border-left:3px solid var(--navy);border-radius:0 5px 5px 0;padding:10px 14px;margin-bottom:18px;font-family:'Segoe UI',sans-serif;font-size:.74rem;color:#444;line-height:1.6;}
.inv-pay strong{display:block;color:var(--navy);font-size:.76rem;margin-bottom:3px;}

.inv-cgv{border-top:1px solid #ddd;padding-top:11px;font-size:.56rem;color:#aaa;line-height:1.55;font-family:'Segoe UI',sans-serif;}
.inv-cgv b{font-weight:700;color:#888;}
.inv-cgv-title{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#888;display:block;margin-bottom:5px;}

.inv-foot{margin-top:10px;padding-top:8px;border-top:1px solid #eee;text-align:center;font-size:.56rem;color:#ccc;font-family:'Segoe UI',sans-serif;letter-spacing:.03em;}

@media print{
  @page{size:A4 portrait;margin:0;}
  body{background:#fff;}
  .app-header,#form-section{display:none!important;}
  #invoice-section{display:block!important;background:#fff;}
  .inv-toolbar{display:none!important;}
  .inv-wrap{margin:0;padding:0;max-width:100%;}
  #invoice-doc{padding:10mm 14mm 8mm;box-shadow:none;}
  .inv-cgv{columns:2;column-gap:14px;font-size:.5rem;line-height:1.4;}
  .inv-cgv-title{column-span:all;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-brand">
    <div class="header-logo">B</div>
    <div>
      <div class="header-title">BRD Services</div>
      <div class="header-sub">Générateur de factures pro forma</div>
    </div>
  </div>
  <div class="header-badge">Souhail Bouardi</div>
</header>

<div id="form-section">
<div class="container">
<div class="card">
  <div class="card-title">📄 Nouvelle facture</div>

  <div class="divider">Référence</div>
  <div class="row">
    <div class="fg"><label>N° facture</label><input type="text" id="f-num" autocomplete="off" placeholder="2026-001"/></div>
    <div class="fg"><label>Date</label><input type="date" id="f-date"/></div>
  </div>

  <div class="divider">Client</div>
  <div class="fg"><label>Nom du client *</label><input type="text" id="f-client" autocomplete="off" placeholder="Nom complet ou raison sociale"/></div>
  <div class="fg"><label>Adresse</label><input type="text" id="f-addr" placeholder="Adresse, code postal, ville"/></div>
  <div class="fg"><label>Email client (pour envoi)</label><input type="email" id="f-email" placeholder="client@email.com"/></div>

  <div class="divider">Prestation</div>
  <div class="fg"><label>Itinéraire / Description *</label><textarea id="f-itin" placeholder="Ex : Aéroport CDG → Paris 8e"></textarea></div>
  <div class="row">
    <div class="fg"><label>Prix H.T. (€) *</label><input type="number" id="f-ht" placeholder="0.00" step="0.01" min="0"/></div>
    <div class="fg"><label>TVA (%)</label><input type="number" id="f-tva" value="10" step="0.5" min="0"/></div>
  </div>

  <button class="btn-gen" onclick="gen()">Générer la facture</button>
</div>
</div>
</div>

<div id="invoice-section">
  <div class="inv-toolbar">
    <button class="btn-pdf" onclick="window.print()">🖨️ PDF / Imprimer</button>
    <button class="btn-mail" id="btn-mail" onclick="sendMail()">✉️ Envoyer par mail</button>
    <button class="btn-back" onclick="back()">← Nouvelle facture</button>
  </div>
  <div class="inv-wrap">
    <div id="invoice-doc"></div>
  </div>
</div>

<script>
var _num='',_date='',_client='',_addr='',_email='',_itin='',_ht=0,_tva=0,_tvaAmt=0,_ttc=0;

function getC(){try{var y=new Date().getFullYear();return{y:y,n:parseInt(localStorage.getItem('brd_'+y)||'0')};}catch(e){return{y:new Date().getFullYear(),n:0};}}
function saveC(y,n){try{localStorage.setItem('brd_'+y,n);}catch(e){}}
function fmtN(y,n){return y+'-'+String(n).padStart(3,'0');}
function money(v){return Number(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+'\u00a0€';}
function fmtD(s){if(!s)return'—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}

window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  var c=getC();document.getElementById('f-num').value=fmtN(c.y,c.n+1);
});

function gen(){
  try{
    _num=document.getElementById('f-num').value.trim();
    _date=document.getElementById('f-date').value;
    _client=document.getElementById('f-client').value.trim();
    _addr=document.getElementById('f-addr').value.trim();
    _email=document.getElementById('f-email').value.trim();
    _itin=document.getElementById('f-itin').value.trim();
    _ht=parseFloat(document.getElementById('f-ht').value)||0;
    _tva=parseFloat(document.getElementById('f-tva').value)||10;

    if(!_client){alert('Nom du client requis.');return;}
    if(!_itin){alert('Itinéraire requis.');return;}
    if(_ht<=0){alert('Prix H.T. requis.');return;}

    _tvaAmt=_ht*(_tva/100);
    _ttc=_ht+_tvaAmt;

    var c=getC(),m=_num.match(/(\d{4})-(\d+)/);
    if(m){var nn=parseInt(m[2]);if(nn>=c.n)saveC(parseInt(m[1]),nn);}

    var ih=_itin.replace(/\n/g,'<br>');

    document.getElementById('invoice-doc').innerHTML=
    '<div class="inv-head">'+
      '<div>'+
        '<div class="inv-brand">BRD Services</div>'+
        '<div class="inv-brand-tag">Transport &amp; Mise à disposition</div>'+
        '<div class="inv-brand-info">Chauffeur\u00a0: Souhail Bouardi<br>SIREN\u00a0: 942\u00a0424\u00a0201<br>SIRET\u00a0: 942\u00a0424\u00a0201\u00a000013<br>N°\u00a0TVA\u00a0: FR35942424201</div>'+
      '</div>'+
      '<div class="inv-title-block">'+
        '<div class="inv-pf">Pro Forma</div>'+
        '<div class="inv-title">FACTURE</div>'+
        '<div class="inv-meta"><strong>N°\u00a0'+(_num||'—')+'</strong><br>Date\u00a0: '+fmtD(_date)+'<br>Validité\u00a0: 30 jours</div>'+
      '</div>'+
    '</div>'+
    '<div class="inv-client">'+
      '<div class="inv-client-label">Client / Destinataire</div>'+
      '<div class="inv-client-name">'+_client+'</div>'+
      (_addr?'<div class="inv-client-addr">'+_addr+'</div>':'')+
    '</div>'+
    '<table class="inv-t"><thead><tr>'+
      '<th style="width:50%">Description</th><th>Qté</th><th>Prix unit. H.T.</th><th>TVA</th><th>Total H.T.</th>'+
    '</tr></thead><tbody><tr>'+
      '<td><div class="svc-name">Prestation de transport</div><div class="svc-desc">'+ih+'</div></td>'+
      '<td>1</td><td>'+money(_ht)+'</td><td>'+_tva+'\u00a0%</td><td>'+money(_ht)+'</td>'+
    '</tr></tbody></table>'+
    '<div class="inv-totals"><div class="inv-totals-inner">'+
      '<div class="t-row"><span>Total H.T.</span><span>'+money(_ht)+'</span></div>'+
      '<div class="t-row"><span>TVA ('+_tva+'\u00a0%)</span><span>'+money(_tvaAmt)+'</span></div>'+
      '<div class="t-row ttc"><span>TOTAL T.T.C.</span><span>'+money(_ttc)+'</span></div>'+
    '</div></div>'+
    '<div class="inv-pay"><strong>Modalités de règlement</strong>'+
      'Paiement à réception — virement bancaire, espèces ou tout autre moyen convenu.<br>'+
      'Tout retard entraîne des pénalités au taux légal + indemnité forfaitaire de 40\u00a0€ (art. L.441-10 C. com.).'+
    '</div>'+
    '<div class="inv-cgv">'+
      '<span class="inv-cgv-title">Conditions Générales de Vente — BRD Services</span>'+
      '<b>1. OBJET —</b> Les présentes CGV s\'appliquent à toutes les prestations de transport réalisées par BRD Services (SIREN 942 424 201). Toute commande implique leur acceptation sans réserve. '+
      '<b>2. PRESTATIONS —</b> Transferts, mises à disposition, navettes, réalisés par Souhail Bouardi, chauffeur professionnel titulaire de tous agréments VTC requis. '+
      '<b>3. TARIFS —</b> Prix en euros H.T. et T.T.C. TVA en vigueur à la date de prestation. Frais annexes (péages, parking) refacturés sur justificatifs. '+
      '<b>4. PAIEMENT —</b> Exigible à réception. Retard : pénalités au taux légal + 40\u00a0€ forfaitaires (art. L.441-10 C. com.). '+
      '<b>5. ANNULATION —</b> Par écrit. Moins de 24h : 50% dû. Jour même / no-show : 100% dû. '+
      '<b>6. RESPONSABILITÉ —</b> Force majeure exonère le Prestataire. Dommages au véhicule : responsabilité du Client. '+
      '<b>7. DONNÉES —</b> Traitement conforme RGPD (UE 2016/679). Données non transmises à des tiers. '+
      '<b>8. LITIGES —</b> Recherche amiable privilégiée. À défaut : tribunaux du siège de BRD Services. '+
      '<b>Document pro forma — Ne constitue pas une facture définitive avant règlement effectif.</b>'+
    '</div>'+
    '<div class="inv-foot">BRD Services \u2014 SIREN\u00a0942\u00a0424\u00a0201 \u2014 SIRET\u00a0942\u00a0424\u00a0201\u00a000013 \u2014 TVA\u00a0: FR35942424201 \u2014 Chauffeur\u00a0: Souhail Bouardi</div>';

    document.getElementById('form-section').style.display='none';
    document.getElementById('invoice-section').style.display='block';
    window.scrollTo(0,0);
  }catch(e){alert('Erreur: '+e.message);}
}

function sendMail(){
  var subj='Facture Pro Forma N\u00b0\u00a0'+_num+' \u2014 BRD Services';
  var body='Bonjour '+_client+',\n\nVeuillez trouver ci-dessous votre facture pro forma.\n\n'
    +'FACTURE PRO FORMA N\u00b0 '+_num+'\n'
    +'Date : '+fmtD(_date)+'\n'
    +'Prestation : '+_itin+'\n\n'
    +'Montant H.T. : '+money(_ht)+'\n'
    +'TVA ('+_tva+'%) : '+money(_tvaAmt)+'\n'
    +'TOTAL T.T.C. : '+money(_ttc)+'\n\n'
    +'Paiement à réception par virement ou espèces.\n\n'
    +'Cordialement,\nSouhail Bouardi\nBRD Services\nSIRET : 942 424 201 00013';
  var dest=_email||'';
  window.location.href='mailto:'+dest+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}

function back(){
  document.getElementById('invoice-section').style.display='none';
  document.getElementById('form-section').style.display='block';
  window.scrollTo(0,0);
  var c=getC();
  document.getElementById('f-num').value=fmtN(c.y,c.n+1);
  document.getElementById('f-client').value='';
  document.getElementById('f-addr').value='';
  document.getElementById('f-email').value='';
  document.getElementById('f-itin').value='';
  document.getElementById('f-ht').value='';
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
}
</script>
</body>
</html>
